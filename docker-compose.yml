services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      ARTIFACT_DIR: /app/artifacts
      CORS_ORIGINS: http://localhost:8501,http://127.0.0.1:8501
    volumes:
      - ./artifacts:/app/artifacts:ro
    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    ports:
      - "8502:8501"
    environment:
      API_URL: http://api:8000
    depends_on:
      - api
    restart: unless-stopped
